<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Sprialator" />
    <meta property="og:description" content="Trippy In-Browser Visualizer" />
    <meta property="og:image" content="https://raw.githubusercontent.com/CollectionOfAtoms/sprialator/main/Sprialator%20Promo.jpg" />
    <meta property="og:url" content="https://collectionofatoms.github.io/sprialator/" />

    <title>Sprialator</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #startup-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 2px 2px 8px black;
            z-index: 100;
            pointer-events: none;
            animation: fadeOut 1s ease-in 2s forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }
    </style>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="overlay"></div>
    <div id="startup-hint">Press space for controls</div>
    <!-- Hidden SVG used only during startup for KUTE morph precomputation -->
    <svg id="spiralSVG" style="display:none"></svg>
    <canvas id="mainCanvas"></canvas>
    <canvas id="textCanvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/kute.js/2.0.0/kute.min.js"></script>
    <!-- <script src="app/assets/js/kute_2.min.js"></script> -->
    <script src="src/dissapearingMouse.js"></script>
    <script src="src/listeners.js" type="module"></script>
    <script src="src/palettes.js" type="module"></script>
    <script src="src/script.js" type="module"></script>
</body>
</html>
